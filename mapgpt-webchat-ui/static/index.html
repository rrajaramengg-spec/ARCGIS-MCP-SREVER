<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>GIS Chat (Demo)</title>
    <!-- Vendor: Markdown & Syntax Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- ArcGIS JS SDK 5.0 -->
    <link rel="stylesheet" href="https://js.arcgis.com/5.0/@arcgis/core/assets/esri/themes/light/main.css" />
    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <!-- App styles -->
    <link rel="stylesheet" href="css/styles.css?v=3" />
</head>

<body>
    <!-- ── Header ──────────────────────────────────────── -->
    <div class="header">
        <div id="status-dot"></div>
        <h1>GIS Chat</h1>
        <span id="status-text">Connecting...</span>
        <span class="demo-tag">DEMO</span>
        <span class="session-tag" id="sessionIndicator"></span>
    </div>

    <!-- ── Main area (split: chat left, map right) ─────── -->
    <div class="main-area">
        <!-- ── Chat panel (left) ───────────────────────── -->
        <div class="chat-panel">
            <button class="panel-toggle-btn" id="chatPanelToggle" title="Maximize chat">&#8862;</button>
            <div class="chat-container">
                <div class="messages" id="messages">
                    <div class="message system">Welcome to GIS Chat! Type a question about your spatial data.</div>
                </div>
                <div class="input-area">
                    <div class="dropdown" id="dropdown"></div>
                    <input type="text" id="input" placeholder="Ask about your spatial data... (type / for commands)"
                        autocomplete="off" />
                    <button id="send" disabled>Send</button>
                </div>
            </div>
            <!-- ── Logs toggle bar ─────────────────────── -->
            <div class="logs-toggle-bar" id="logsToggleBar">
                <span id="logsToggleLabel">&#9650; Logs</span>
            </div>
            <!-- ── Logs panel ──────────────────────────── -->
            <div class="logs-panel" id="logsPanel">
                <div class="logs-header">
                    <span>Logs <span class="badge" id="logCount">0</span></span>
                    <button id="clearLogs">Clear</button>
                </div>
                <div class="logs-body" id="logsBody"></div>
            </div>
        </div>

        <!-- ── Map panel (right) ───────────────────────── -->
        <div class="map-panel">
            <button class="panel-toggle-btn" id="mapPanelToggle" title="Maximize map">&#8862;</button>
            <div class="map-panel-header">
                <span>Map</span>
                <button id="clearMapBtn">Clear Map</button>
            </div>
            <div id="map-container"></div>
        </div>
    </div>

    <!-- ── Raw Response Modal ───────────────────────────── -->
    <div class="modal-overlay" id="rawModal">
        <div class="modal-dialog">
            <div class="modal-header">
                <span class="modal-title" id="rawModalTitle">Raw Response</span>
                <div class="modal-actions">
                    <button class="modal-copy-btn" id="rawModalCopy" title="Copy to clipboard">&#128203; Copy</button>
                    <button class="modal-close-btn" id="rawModalClose" title="Close">&times;</button>
                </div>
            </div>
            <div class="modal-body" id="rawModalBody"></div>
        </div>
    </div>

    <!-- ── Marked.js setup (must run before modules) ───── -->
    <script>
        marked.setOptions({ breaks: true, gfm: true });
    </script>

    <!-- ── App entry point ─────────────────────────────── -->
    <script type="module" src="js/app.js?v=3"></script>
</body>

</html>
